name: HTML to APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Directory (www)
        run: |
          # Güvenli bir package.json oluştur
          if [ ! -f package.json ]; then
            echo '{"name": "html-game", "version": "1.0.0"}' > package.json
          fi
          
          # www adında temiz bir web klasörü oluştur
          mkdir -p www
          
          # Eğer ana dizinde bir index.html varsa onu www içine kopyala
          if [ -f index.html ]; then
            cp index.html www/
          else
            # Eğer index.html yoksa (farklı bir html varsa veya klasör içindeyse)
            # Sürecin çökmemesi için www içine geçici bir index.html oluşturuyoruz
            echo '<!DOCTYPE html><html><head><title>Game</title></head><body><h1 style="text-align:center; margin-top:20%;">Oyun Yukleniyor...</h1></body></html>' > www/index.html
          fi
          
          # Projedeki diğer tüm dosyaları (resim, css, js vb.) www klasörüne kopyala (www'nin kendisi hariç)
          shopt -s extglob
          cp -r !(www|.git|.github|node_modules|package.json|package-lock.json) www/ 2>/dev/null || true

          # Konfigürasyonu www klasörünü görecek şekilde ayarla
          echo '{"appId": "com.oyun.app", "appName": "MobilOyun", "webDir": "www"}' > capacitor.config.json

      - name: Install Capacitor CLI & Android Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: |
          npx --yes cap add android

      - name: Sync Capacitor
        run: |
          npx --yes cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
