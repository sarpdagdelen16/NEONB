name: HTML to APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Project Files
        run: |
          # Eğer package.json yoksa hata vermemesi için oluştur
          if [ ! -f package.json ]; then
            echo '{"name": "html-game", "version": "1.0.0"}' > package.json
          fi
          
          # Eğer index.html yoksa zorunlu bir tane oluştur
          if [ ! -f index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Game</title></head><body></body></html>' > index.html
          fi

          # Manuel olarak konfigürasyon dosyasını oluşturup hata payını sıfırlıyoruz
          echo '{"appId": "com.oyun.app", "appName": "MobilOyun", "webDir": ".", "bundledWebRuntime": false}' > capacitor.config.json

      - name: Install Capacitor CLI & Android Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform (Non-Interactive)
        run: |
          # --no-interactive takısı ile onay beklemeleri tamamen bypass edilir
          npx cap add android --no-interactive

      - name: Sync Capacitor
        run: |
          npx cap sync android --no-interactive

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
