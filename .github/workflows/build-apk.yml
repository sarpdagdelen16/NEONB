name: HTML to APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Directory (www)
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "html-game", "version": "1.0.0"}' > package.json
          fi
          
          mkdir -p www
          
          if [ -f index.html ]; then
            cp index.html www/
          else
            echo '<!DOCTYPE html><html><head><title>Game</title></head><body><h1 style="text-align:center; margin-top:20%;">Oyun Yukleniyor...</h1></body></html>' > www/index.html
          fi
          
          shopt -s extglob
          cp -r !(www|.git|.github|node_modules|package.json|package-lock.json) www/ 2>/dev/null || true

          echo '{"appId": "com.oyun.app", "appName": "MobilOyun", "webDir": "www"}' > capacitor.config.json

      - name: Install Capacitor CLI & Android Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android Platform
        run: |
          npx --yes cap add android

      - name: Sync Capacitor
        run: |
          npx --yes cap sync android

      # KOTLIN ÇAKIŞMASINI ÇÖZEN ADIM: Eski sürümleri engelleyip tek bir güncel stdlib sürümünü zorunlu kılıyoruz.
      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> android/app/build.gradle

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
