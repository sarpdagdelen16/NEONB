name: HTML to APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Project & Install Capacitor
        run: |
          # Eğer package.json yoksa hata vermemesi için güvenli başlatma yapıyoruz
          if [ ! -f package.json ]; then
            echo '{"name": "html-game", "version": "1.0.0"}' > package.json
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          # Mevcut bir yapılandırma varsa çakışmayı önlemek için siliyoruz
          rm -f capacitor.config.json
          npx cap init MobilOyun com.oyun.app --web-dir .

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
